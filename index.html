<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="generator" content="Arc Studio by Circle — https://studio.arc.io" />
    <meta name="theme-color" content="#0a1222" />
    <!-- Applies the saved theme (or the device theme) before the first paint, so there is no flash of the wrong one. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('quickpay.theme-pref');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = pref === 'dark' || pref === 'light' ? pref : dark ? 'dark' : 'light';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.themePref = pref === 'dark' || pref === 'light' ? pref : 'system';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a1222' : '#f6f8fb');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in the system font until they arrive (display=swap). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>
    <title>Quick Pay</title>
  </head>
  <body>
    <!-- Built with Arc Studio — https://studio.arc.io -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
